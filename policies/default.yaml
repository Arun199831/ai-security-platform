version: 1
name: default

input:
  max_chars: 4000
  classifier:
    block_threshold: 0.9
    flag_threshold: 0.5
    on_failure: block
  rules:
    ignore_instructions: block
    reveal_system_prompt: block
    role_override: block

output:
  max_chars: 20000
  secrets: block
  marker_leak: block
  classifier:
    on_failure: block
    safety_policy_file: policies/output_safety.md
    categories:
      harmful_instructions: block
      jailbreak_compliance: block
      hate_harassment: block
      self_harm: block
      personal_data: flag
